[project]
name = "gundb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lee Braiden", email = "lee.braiden@pm.me" }
]
requires-python = ">=3.11"
dependencies = [
    "psycopg2>=2.9.10",
    "pydantic>=2.10.6",
    "sqlalchemy>=2.0.39",
]

[project.scripts]
gundb = "gundb.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
